<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale and no user-scalable=no: pinch-zoom stays available. WCAG 1.4.4, and
         this app's dominant use is a bookshop in poor light reading 11-14px metadata.
         viewport-fit=cover is the only part that is load-bearing — it is what lets the header
         and bottom actions pad into the notch and home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0B" />
    <meta name="description" content="Alexandria — a circulation record for a physical collection" />
    <!-- Both, deliberately, and neither is redundant. `mobile-web-app-capable` is the standard
         name; Chrome now warns that the apple-prefixed one is deprecated. But the prefixed tag is
         what iOS has historically honoured for standalone launch, and this app is installed as a
         PWA on a phone (PRODUCT.md), so dropping it to silence a Chrome warning would trade a
         console line for a regression on the platform that matters most here. One line each. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Alexandria" />
    <!-- The icon set. Generated by `yarn icons` from the three committed SVG sources in public/;
         the web-app-manifest half of the list is built from tools/pwa-icons.js and injected by
         vite-plugin-pwa, so only the two things a manifest cannot declare are written by hand here.

         The .ico first, and it is not vestigial: a browser requests /favicon.ico by path with no
         <link> involved, so the file has to exist regardless — declaring it just stops the tab
         falling back to that guess. The SVG is listed after it because a browser that understands
         `type="image/svg+xml"` prefers it whatever the order, and one that does not ignores the
         line entirely.

         The SVG is the FAVICON variant, not the full mark: it drops the index rule, which at 16px
         is one pixel from the letter's baseline and merges with it. See the measurement in
         public/icon-source-favicon.svg.

         apple-touch-icon is a <link> because iOS does not read the manifest's icon list for the
         home-screen mark. It takes the full-bleed standard mark: iOS applies its own rounded mask
         and composites over the artwork, so the maskable variant's inset would be inset twice. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="icon" type="image/svg+xml" href="/icon-source-favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/logo180.png" />
    <title>Alexandria</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
